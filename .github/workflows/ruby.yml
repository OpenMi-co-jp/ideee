# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Backend test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ dev ]
    types:
      [opened, reopened, synchronize]

jobs:
  test:
    name: Run rspec
    runs-on: ubuntu-latest

    steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    steps:
    - name: Check out code
      uses: actions/checkout@v2
      env:
        RAILS_ENV: test
        DATABASE_USER: root
        DATABASE_HOST: 127.0.0.1
      services:
        db:
          image: mysql:5.7
          options: >-
            --health-cmd "mysqladmin ping"
            --health-interval 3s
            --health-timeout 5s
            --health-retries 5
          env:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: ideee_test
            MYSQL_USER: root
          ports:
            - 4306:3306

    - name: Rspec
      run:  |
        bundle exec rspec --exclude-pattern "spec/requests/*_spec.rb"
      env:
        RAILS_ENV: test

  vulnerability:
    name: Run brakeman test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Run Brakeman
      run:  |
        bundle exec brakeman

  linter:
    name: Run rubocop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Run Rubocop
      run:  |
        cd application
        bundle exec rubocop
