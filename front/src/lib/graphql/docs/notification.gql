query GetNotifications {
  notifications {
    id
    visitedId
    checked
    notificatableId
    notificatableType
  }
}

mutation UpdateNotificationConfig($input: UpdateNotificationConfigInput!){
  updateNotificationConfig(input: $input){
    success
    notificationConfig{
      commentEmail
      commentWeb
      draftRemindEmail
      eventEmail
      heartEmail
      heartToCommentWeb
      heartWeb
      teamJoinEmail
      teamJoinWeb
      teamMessageEmail
      voteWeb
      weeklyEmail
    }
  }
}