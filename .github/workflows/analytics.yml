name: post analytics to slack

on:
  schedule:
    - cron: '0 7 * * *'

jobs:
  vulnerability:
    name: Run rake task
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Run rake task
      run: |
        bundle install
        bundle exec rake report_analytics:send_to_slack
