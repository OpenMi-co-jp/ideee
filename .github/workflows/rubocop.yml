name: rubocop

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'front/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linter:
    name: Run rubocop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4.11
        bundler-cache: true
        working-directory: ./api

    - name: Run rubocop
      run: |
        cd api
        bundle exec rubocop
