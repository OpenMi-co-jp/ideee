version: '3'
services:
  db:
    platform: linux/x86_64
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: 'password'
      TZ: "Asia/Tokyo"
    ports:
      - "4306:3306"
  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/ideee
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - web-variables.env
    environment:
      REDIS_URL: redis://redis:6379
    entrypoint:
      - dockerize
      - -timeout
      - 60s
      - -wait
      - tcp://db:3306
  redis:
    image: redis:latest
    volumes:
      - redis:/data
    ports:
      - 6379:6379
  sidekiq:
    build: .
    command: bundle exec sidekiq
    volumes:
      - .:/ideee
      - bundle_data:/usr/local/bundle
    depends_on:
      - db
      - redis
    environment:
      REDIS_URL: redis://redis:6379
# 永続化領域
volumes:
  bundle_data:
  redis:
  rails_tmp_cache:
