name: send weekly mail at Monday 12 AM

on:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  vulnerability:
    name: Run send weekly mail
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Run send weekly mail
      run: |
        bundle install
        bundle exec rake weekly_mail:send
