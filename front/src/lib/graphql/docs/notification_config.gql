query GetNotificationConfig {
  notificationConfig {
    userId
    commentEmail
    draftRemindEmail
    eventEmail
    heartEmail
    teamJoinEmail
    teamLeaveEmail
    teamMessageEmail
    weeklyEmail
  }
}

mutation UpdateNotificationConfig($input: UpdateNotificationConfigInput!) {
  updateNotificationConfig(input: $input) {
    success
    errors
    notificationConfig {
      commentEmail
      draftRemindEmail
      eventEmail
      heartEmail
      teamJoinEmail
      teamLeaveEmail
      teamMessageEmail
      weeklyEmail
    }
  }
}
