query GetLikes {
  likes {
    id
    userId
    likableType
    likableId
  }
}

mutation CreateLike($input: CreateLikeInput!) {
  createLike(input: $input) {
    like {
      likableType
      likableId
    }
    success
  }
}

mutation DestroyLike($input: DestroyLikeInput!) {
  destroyLike(input: $input) {
    success
    errors
  }
}
