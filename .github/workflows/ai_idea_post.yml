name: AIでアイデア自動投稿

on:
  schedule:
    - cron: '0 23 * * *'  # 毎日8時に実行 (日本時間 JSTはUTC+9)

jobs:
  create_ai_idea:
    name: Create AI Idea
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Run AI Idea Creator on Heroku
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      run: |
        heroku run bundle exec rake ai_idea_creator:create_idea -a ideee-tech
