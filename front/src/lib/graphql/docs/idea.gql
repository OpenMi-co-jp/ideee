mutation CreateIdea($input: CreateIdeaInput!) {
  createIdea(input: $input) {
    idea {
      userId
      id
      name
      background
      goal
      target
    }
    success
    errors
  }
}

mutation UpdateIdea($input: UpdateIdeaInput!) {
  updateIdea(input: $input) {
    idea {
      id
      name
      background
      goal
      issue
      hypothesis
      monetize
      similar
      stance
      target
      wishFunction
      githubUrl
      productUrl
      draft
      iconUrl
    }
    success
    errors
  }
}

mutation DestroyIdea($input: DestroyIdeaInput!) {
  destroyIdea(input: $input) {
    success
  }
}

mutation AiReview($input: IdeaAiReviewInput!) {
  createAiReview(input: $input) {
    jobId
    success
    errors
  }
}

mutation AiBrushUp($input: IdeaAiBrushUpInput!) {
  createAiBrushUp(input: $input) {
    jobId
    success
    errors
  }
}

