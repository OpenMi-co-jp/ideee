# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: test

on:
  workflow_dispatch:
  pull_request:
    types:
      [opened, reopened, synchronize]

jobs:
  test:
    name: Run rspec
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      MYSQL_USER: root
      MYSQL_PASSWORD: "password"
      DATABASE_USER: root
      MYSQL_HOST: 127.0.0.1
    services:
      mysql:
        image: mysql:5.7
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 5
        env:
          MYSQL_ROOT_PASSWORD: "password"
          MYSQL_DATABASE: ideee_test
        ports:
          - 4306:3306

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Setup mysql
      run: |
        sudo /etc/init.d/mysql start
        sudo mysql -h 127.0.0.1 --port 4306 -u root -ppassword
      env:
        RAILS_ENV: test

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Migrate database
      run: |
        bundle exec rails db:migrate

    - name: Rspec
      run:  |
        bundle exec rspec --exclude-pattern "spec/requests/*_spec.rb"

  vulnerability:
    name: Run brakeman test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Run Brakeman
      run:  |
        bundle exec brakeman

  linter:
    name: Run rubocop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Run Rubocop
      run:  |
        bundle exec rubocop
