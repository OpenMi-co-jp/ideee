# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: test

on:
  workflow_dispatch:
  pull_request:
    types:
      [opened, reopened, synchronize]

jobs:
  backend_check:
    name: Run rspec
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setup docker
      shell: bash
      run: |
        docker-compose build
        docker-compose run web rails db:create
      env:
        RAILS_ENV: test
        MYSQL_HOST: db

  vulnerability:
    name: Run brakeman test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Run Brakeman
      run:  |
        bundle exec brakeman

  linter:
    name: Run rubocop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Run Rubocop
      run:  |
        bundle exec rubocop

  PR_check:
    name: Run danger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true
        working-directory: ./api

    - name: Run Danger
      run:  |
        cd api
        bundle exec danger
