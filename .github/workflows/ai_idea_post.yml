name: AIでアイデア自動投稿

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 */3 * *' # 3日に1回、8時(JST)に実行

jobs:
  create_ai_idea:
    name: Create AI Idea
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    - name: Run AI Idea Creator on Heroku
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      run: |
        heroku run bundle exec rake ai_idea_creator:create_idea -a ideee-tech
