query GetIdea($id: ID!) {
  idea(id: $id) {
    id
    name
    iconUrl
    background
    goal
    issue
    wishFunction
    hypothesis
    target
    monetize
    similar
    stance
		note
    draft
    difficulty
    productApply
    createdAt
    updatedAt
    publishedAt
    userId
    likesNum
    productUrl
    githubUrl
    user {
      id
      name
      image
      twitterId
    }
    comments {
      id
      description
      createdAt
      userId
      user {
        name
        image
      }
    }
    ideaTags {
      id
      name
    }
    reviews {
      id
      content
      stance
    }
  }
}

query GetIdeas($searchCondition: SearchCondition, $sort: SortCondition, $page: Int, $per: Int) {
  ideas(searchCondition: $searchCondition, sort: $sort, page: $page, per: $per) {
    nodes {
      id
      name
      commentsNum
      difficulty
      likesNum
      view
      updatedAt
      publishedAt
      user {
        id
        name
        image
      }
      ideaTags {
        id
        name
      }
      team {
        status
        membersNum
      }
    }
    pageInfo {
      currentPage
      isFirst
      isLast
      nextPage
      per
      prevPage
      totalCount
      totalPages
    }
  }
}

