name: Qiita自動投稿

on:
  schedule:
    - cron: '0 15 * * *'  # 日本時間に調整

jobs:
  post_qiita_article:
    name: Run post qiita article
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1.3
        bundler-cache: true

    # Authenticate with Heroku CLI
    - name: Authenticate with Heroku
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      run: |
        heroku auth:token

    # Run the Heroku command
    - name: Run post qiita article on Heroku
      run: |
        heroku run bundle exec rake auto_update_qiita_post:update_recent_ideas -a ideee-tech
